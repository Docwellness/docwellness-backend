# Local dev/testing only - NOT the production topology. Production runs on
# a Coolify-managed Oracle VPS where the backend and Laya are separate
# Coolify "resources" (there is no docker-compose.yml driving prod today -
# see the Dockerfile and docs/db-migration-oracle.md). See
# docs/laya-deployment.md for the operator-executed Coolify steps.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.laya.yml up
# (or run standalone with `docker compose -f docker-compose.laya.yml up` if
# you already have Mongo/Redis running separately for local dev).
#
# The image is built from Dockerfile.laya (laya[serve] from PyPI, CPU-only
# torch). First request downloads checkpoint weights into the model-cache
# volume, so keep LAYA_PRELOAD=1 outside throwaway local runs - a cold lazy
# load takes longer than LAYA_TIMEOUT_MS and would soft-fail the call.

services:
  laya:
    build:
      context: .
      dockerfile: Dockerfile.laya
    restart: unless-stopped
    environment:
      LAYA_DEVICE: cpu
      LAYA_JEV_STRICT: '1'
      # Keep at or below the number of PHYSICAL cores available to Laya -
      # never assume all host cores are free (the backend and any other
      # local services need their share too). Tune with a load test before
      # trusting a number - see docs/laya-deployment.md.
      LAYA_THREADS: ${LAYA_THREADS:-2}
      LAYA_PRELOAD: ${LAYA_PRELOAD:-1}
      LAYA_MODELS: typed-decisions # preload list uses short names (english, multilingual, typed-decisions)
      LAYA_API_KEY: ${LAYA_API_KEY}
    # No `ports:` mapping to the host - only the `backend` service (on the
    # same Docker network) can reach Laya, by its service name. This is the
    # local-dev analogue of "bind to an internal network only, never expose
    # publicly" - see config/environment.js's laya.baseUrl comment.
    volumes:
      - laya-model-cache:/models # persist downloaded model weights across restarts
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    # non-root: Dockerfile.laya runs as uid 1000

  backend:
    environment:
      LAYA_ENABLED: ${LAYA_ENABLED:-false}
      LAYA_MODE: ${LAYA_MODE:-off}
      # Internal Docker DNS by service name - separate containers do not
      # share a localhost network namespace, so this is never 127.0.0.1.
      LAYA_BASE_URL: http://laya:8000
      LAYA_API_KEY: ${LAYA_API_KEY}
      LAYA_MODEL: ${LAYA_MODEL:-laya-typed-decisions}
    depends_on:
      laya:
        condition: service_healthy

volumes:
  laya-model-cache:
